<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RedBeetle Games</title>
<meta name="description" content="RedBeetle Games, estudio independiente de videojuegos para móvil.">
<link rel="icon" type="image/png" href="redbeetle.png">
<style>
  :root { color-scheme: light dark; --fg: #1c1c1c; --muted: #666; --bg: #fafaf8; --accent: #b3261e; --line: #e2e0dc; }
  @media (prefers-color-scheme: dark) { :root { --fg: #ecebe8; --muted: #a3a19c; --bg: #141414; --accent: #e5584f; --line: #2e2d2b; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 40em; margin: 0 auto; padding: 4em 1em 3em; }
  h1 { font-size: 2.4em; line-height: 1.1; margin: 0 0 .2em; letter-spacing: -.02em; }
  h1 span { color: var(--accent); }
  .logo { display: block; width: 96px; height: 96px; border-radius: 20px; margin: 0 0 1.2em; }
  .lead { color: var(--muted); margin: 0 0 3em; }
  h2 { font-size: 1.3em; margin: 0 0 .3em; }
  .game { border-top: 1px solid var(--line); padding-top: 1.5em; }
  a { color: var(--accent); }
  footer { max-width: calc(40em / .9); margin: 0 auto; padding: 0 1em 3em; color: var(--muted); font-size: .9em; }
</style>
</head>
<body>
<main>
  <img class="logo" src="redbeetle.png" alt="" width="96" height="96">
  <h1><span>RedBeetle</span> Games</h1>
  <p class="lead">Estudio independiente de videojuegos para móvil.</p>

  <section class="game">
    <h2>Tanks</h2>
    <p>Duelo de tanques por turnos: un tanque cada uno, turnos rápidos y a cazarse en la niebla.</p>
    <p><a href="tanks/privacidad">Política de privacidad</a></p>
  </section>
</main>
<footer>Contacto: <a href="mailto:redbeetlegamestudio@gmail.com">redbeetlegamestudio@gmail.com</a></footer>
</body>
</html>
